<style>
:root{
  --bg:#f5f6f4;--surface:#fff;--surface2:#eef1ee;--text:#1a1f1c;--muted:#5b655f;--border:#dce1dd;
  --accent:#0f766e;--accent-ink:#fff;--accent-soft:#dff1ee;
  --gain:#15803d;--loss:#b91c1c;--warn:#8a4b08;--warn-bg:#fdf1d3;--warn-border:#e8a33a;
  --info-bg:#e6f2f1;--danger:#b91c1c;--danger-bg:#fde8e8;--bar:#0f766e;--bar-target:#1a1f1c;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101412;--surface:#191e1b;--surface2:#222825;--text:#e6ebe8;--muted:#9aa49e;--border:#2d3430;
    --accent:#2cc4b0;--accent-ink:#04201c;--accent-soft:#12302c;
    --gain:#4ade80;--loss:#f87171;--warn:#f5c55a;--warn-bg:#35280c;--warn-border:#a86a12;
    --info-bg:#132824;--danger:#f87171;--danger-bg:#3a1515;--bar:#2cc4b0;--bar-target:#e6ebe8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412;--surface:#191e1b;--surface2:#222825;--text:#e6ebe8;--muted:#9aa49e;--border:#2d3430;
  --accent:#2cc4b0;--accent-ink:#04201c;--accent-soft:#12302c;
  --gain:#4ade80;--loss:#f87171;--warn:#f5c55a;--warn-bg:#35280c;--warn-border:#a86a12;
  --info-bg:#132824;--danger:#f87171;--danger-bg:#3a1515;--bar:#2cc4b0;--bar-target:#e6ebe8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1{font-size:1.45rem;margin:.2rem 0 1rem}
h2{font-size:1.1rem;margin:0 0 .6rem}
h3{font-size:.95rem;margin:1rem 0 .4rem}
a{color:var(--accent)}
.steps{margin:6px 0 12px;padding-left:20px}.steps li{margin:3px 0}
.ext{font-size:.8rem;font-weight:600;white-space:nowrap}
small,.muted{color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.gain{color:var(--gain)}.loss{color:var(--loss)}
.nowrap{white-space:nowrap}

/* layout */
.app{min-height:100vh}
main{padding:16px 16px calc(84px + env(safe-area-inset-bottom));max-width:1100px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--muted);text-decoration:none;font-size:11px}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--accent);font-weight:600}
.nav .brand,.nav .desk{display:none}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:220px minmax(0,1fr)}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--border);padding:16px 10px;gap:2px}
  .nav a{flex:0;flex-direction:row;gap:10px;padding:9px 10px;font-size:14px;border-radius:8px}
  .nav a.on{background:var(--accent-soft)}
  .nav .brand{display:block;font-weight:700;font-size:15px;padding:4px 10px 14px}
  .nav .desk{display:flex}.nav .mob{display:none}
  main{padding:24px 32px 48px}
}

/* cards & bits */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.card.warn{background:var(--warn-bg);border-color:var(--warn-border)}
.card.info{background:var(--info-bg)}
.cards{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.cards.two{grid-template-columns:1fr 1fr}}
.cards>.card{margin:0}
.bignum{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:10px 0 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.kv dt.sub,.kv dd.sub{padding-left:14px;font-size:.92em}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{padding:8px 12px;border-radius:8px;margin-bottom:6px;background:var(--surface2)}
.alerts li.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.alerts li.bad{background:var(--danger-bg);color:var(--loss)}
.badge{display:inline-block;font-size:11px;font-weight:600;line-height:1;padding:4px 6px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);white-space:nowrap;vertical-align:middle}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.badge.bad{background:var(--danger-bg);color:var(--loss);border-color:transparent}
.badge.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badges{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.bad{background:var(--danger-bg);border-color:var(--danger)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
footer{margin-top:28px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--border);padding-top:12px}

/* buttons & forms */
.btn{font:inherit;font-size:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:30px;padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px;min-height:0}
.btn.link.ext{padding:0;font-size:.8rem;font-weight:600}
.badge.hit{background:color-mix(in srgb,var(--gain) 18%,transparent);color:var(--gain);border-color:transparent}
table.data tr.hit td{background:color-mix(in srgb,var(--gain) 9%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.form{display:grid;gap:12px}
.form>div:empty{display:none}
.warn-txt{color:var(--warn);font-weight:600}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.85rem;font-weight:600}
.field>span small{font-weight:400}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical}
.row2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.row3{display:grid;gap:12px;grid-template-columns:1fr 1fr 1fr}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}}
.inline{display:flex;gap:8px}.inline input{flex:1}
.hint{font-size:.83rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg label,.seg button{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span,.seg button{display:block;padding:7px 14px;border-radius:8px;font-size:14px;cursor:pointer;border:0;background:none;color:var(--text);font:inherit;font-size:14px}
.seg input:checked+span,.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.msg{padding:9px 12px;border-radius:8px;font-size:.92rem;margin:0 0 6px}
.msg.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.msg.bad{background:var(--danger-bg);color:var(--loss)}
.msg.info{background:var(--info-bg)}
fieldset{border:1px solid var(--border);border-radius:10px;padding:10px 12px 12px;margin:0;display:grid;gap:12px;min-width:0}
legend{font-weight:700;padding:0 6px}

/* picker */
.picker{position:relative}
.pk-list{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:300px;overflow:auto;margin-top:2px}
.pk-opt{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:none;color:var(--text);font:inherit;padding:9px 10px;cursor:pointer;border-bottom:1px solid var(--border)}
.pk-opt:hover,.pk-opt.hl{background:var(--surface2)}
.pk-opt span{color:var(--muted);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pk-add{color:var(--accent);font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.data{border-collapse:collapse;width:100%;font-size:13.5px}
table.data th,table.data td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.data th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
table.data th.num,table.data td.num{text-align:right}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--surface2)}
table.data tr.detail td{background:var(--surface2);font-size:13px}
table.data tfoot td{font-weight:700}
table.data.wide td{white-space:nowrap}
table.data.wl{width:auto;min-width:0}table.data.wl th,table.data.wl td{padding-right:18px}
.nm{display:inline-block;vertical-align:bottom;max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rng{min-width:120px}.rng .bar{position:relative;height:6px;border-radius:3px;background:var(--border);margin:7px 0 4px}.rng .dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent,#3b82f6);border:2px solid var(--surface,#fff);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--muted)}.rng .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}

/* positions */
table.data tr.att-stop td{background:var(--danger-bg)}
table.data tr.att-target td{background:color-mix(in srgb,var(--gain) 9%,transparent)}
table.data tr.att-warn td{background:var(--warn-bg)}
table.data.pos td{vertical-align:middle}
table.data.pos .chev{width:28px;padding-right:0}
.chev-btn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 28px;white-space:normal}
.exp h3{margin:8px 0 4px}
.exp .hist{max-height:260px;overflow:auto}
.strip{display:flex;flex-wrap:wrap;gap:8px 32px;align-items:baseline;margin-bottom:6px}
.strip .l{font-size:.75rem;color:var(--muted)}.strip .v{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
.rng.st .dot.out{background:var(--loss)}
.grp-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin:18px 0 8px}
.grp-head h2{margin:0}
.grp-stats{flex-basis:100%}
details{margin-top:10px}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem}
details.fold{margin-top:0}
.md h4{margin:12px 0 4px;font-size:1rem}.md p{margin:4px 0}.md ul,.md ol{margin:4px 0;padding-left:1.3em}.md li{margin:2px 0}
.review{padding:8px 0}.review+.review,details .review{border-top:1px dashed var(--border)}
.review-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.review-head .btn{margin-left:auto}
details.fold>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;color:inherit;font-size:inherit}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{margin:0}
details.fold>summary::after{content:'+';color:var(--accent);font-size:1.3rem;font-weight:600}
details.fold[open]>summary::after{content:'\2212'}
details.fold[open]>summary{margin-bottom:10px}
.hist{list-style:none;padding:0;margin:8px 0}
.hist li{padding:6px 0;border-bottom:1px dashed var(--border);font-size:.9rem}

/* allocation bars */
.alloc{display:grid;gap:10px;margin-top:6px}
.alloc-row{display:grid;grid-template-columns:90px 1fr 110px;gap:10px;align-items:center;font-size:.9rem}
.alloc-row.out{color:var(--warn);font-weight:600}
.alloc-bar{position:relative;height:12px;background:var(--surface2);border-radius:6px}
.alloc-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:6px}
.alloc-row.out .alloc-bar i{background:var(--warn-border)}
.alloc-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bar-target)}

/* list rows */
.list{display:grid;gap:0}
.lrow{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border)}
.lrow .main{flex:1;min-width:0}
.lrow .main .sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.tagbtn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 10px;cursor:pointer;min-width:58px}
.tagbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{width:auto;flex:1 1 160px}

/* modal & toast */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:620px){.modal-back{align-items:center}.modal{border-radius:14px}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
@media (min-width:900px){.toast{bottom:24px}}
.more-list a{display:block;padding:14px 4px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text);font-weight:600}
.more-list a small{display:block;font-weight:400}
</style>
</head>

<script>
'use strict';
/* Pinoy Trade Journal (MIT license). Everything the app does is in this file. */

// ===== Constants =====
const APP = 'pinoy-trade-journal';
const DATA_VERSION = 1;
const APP_VERSION = '1.0.0';
const STORE_KEY = 'pinoy-trade-journal';
const META_KEY = 'pinoy-trade-journal:ui';
const HORIZONS = ['long', 'mid', 'trading'];
const HL = { long: 'Long term', mid: 'Mid term', trading: 'Trading' };
const DEFAULT_ALLOC = { long: 50, mid: 30, trading: 0, cash: 20 };
const HOLD = { long: 'over a year', mid: '1–12 months', trading: 'under 1 month' };
// Why a stock is interesting: qualities of the business, never the price. [short label, what it means]
const WL_REASONS = {

  const a = new Uint8Array(12); crypto.getRandomValues(a);

}
const pad = n => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dayNum(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; }
function daysBetween(a, b) { return dayNum(b) - dayNum(a); }
function addMonths(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
  return `${first.getUTCFullYear()}-${pad(first.getUTCMonth() + 1)}-${pad(Math.min(d, last))}`;
}
// A real calendar date written YYYY-MM-DD, year 1000 or later (earlier years don't survive the round trip below).
function isRealDate(v) { return typeof v === 'string' && DATE_RE.test(v) && +v.slice(0, 4) >= 1000 && addMonths(v, 0) === v; }
function isoLocal(d = new Date()) {
  const off = -d.getTimezoneOffset(), sg = off >= 0 ? '+' : '-', a = Math.abs(off);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${sg}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
}
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(s) { if (!s) return '—'; const [y, m, d] = s.slice(0, 10).split('-').map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; }
function daysAgo(iso) {
  if (!iso) return null;
  return Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 864e5));
}
function parseNum(s) {
  let t = String(s ?? '').replace(/[₱\s]/g, '');
  if (/^\d{1,3}(,\d{3})+(\.\d*)?$/.test(t)) t = t.replace(/,/g, '');
  if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) return NaN; // plain decimals only: no 1e3, 0x10, Infinity or stray commas
  const n = Number(t);
  return n <= 1e12 ? n : NaN;
}

const C = x => Math.round(Number(x) * 100);

  if (c == null || !isFinite(c)) return '—';
  const s = (Math.abs(c) / 100).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (c < 0 ? '−' : (sign && c > 0 ? '+' : '')) + '₱' + s;
}

  if (x == null || !isFinite(x)) return '—';
  const v = x * 100, s = Math.abs(v).toFixed(dp);

// Upgrade older backups here when DATA_VERSION goes up.
function migrate(doc) { return doc; }

function validateDoc(raw) {
  const fail = m => { throw new Error(m); };
  try {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) fail('The file is not a JSON object.');
    if (raw.app !== APP) fail('This file is not a Pinoy Trade Journal backup.');
    if (!Number.isInteger(raw.version) || raw.version < 1) fail('The backup has no valid data version.');
    if (raw.version > DATA_VERSION) fail(`This backup was made by a newer version of the app (data version ${raw.version}; this app reads up to ${DATA_VERSION}). Update the app, then import it.`);
    const src = migrate(raw);
    const d = emptyDb();
    const ids = new Set();
    const isDate = isRealDate;
    const isStamp = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}(T|$)/.test(v) && isRealDate(v.slice(0, 10)) && Date.parse(v) <= Date.now() + 864e5;
    const fin = v => typeof v === 'number' && isFinite(v);
    const known = (map, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(map, k);
    const pos = v => typeof v === 'number' && isFinite(v) && v > 0 && v <= 1e12;
    const numOrNull = v => v == null || v === '' ? null : (typeof v === 'number' && isFinite(v) && v >= 0 && v <= 1e12 ? (v > 0 ? v : null) : fail('A plan has an invalid target or stop.'));
    const str = v => typeof v === 'string' ? v : (v == null ? '' : String(v));
    const id = (v, what) => { if (typeof v !== 'string' || !ID_RE.test(v)) fail(`A ${what} has a missing or invalid id.`); if (ids.has(v)) fail(`Duplicate id ${v}.`); ids.add(v); return v; };
    const arr = k => {
      const a = src[k] == null ? [] : Array.isArray(src[k]) ? src[k] : fail(`"${k}" should be a list.`);
      if (a.some(e => !e || typeof e !== 'object' || Array.isArray(e))) fail(`"${k}" has an entry that is not an object.`);
      return a;
    };
    const tick = (v, what) => { const t = normT(v); if (!TICKER_RE.test(t)) fail(`A ${what} has an invalid ticker "${String(v).slice(0, 20)}".`); return t; };
    d.exported_at = isStamp(src.exported_at) ? src.exported_at : null;
    d.last_backup_at = isStamp(src.last_backup_at) ? src.last_backup_at : null;
    for (const t of arr('trades')) {
      if (!isDate(t.date)) fail('A trade has an invalid date.');
      if (t.side !== 'buy' && t.side !== 'sell') fail(`Trade on ${t.date} has an invalid side.`);
      if (!Number.isInteger(t.shares) || t.shares <= 0 || t.shares > 1e12) fail(`Trade on ${t.date} has invalid shares.`);
      if (!pos(t.price) || !pos(t.net_amount)) fail(`Trade on ${t.date} has an invalid price or net amount.`);
      const o = { id: id(t.id, 'trade'), date: t.date, side: t.side, ticker: tick(t.ticker, 'trade'), shares: t.shares, price: t.price, net_amount: t.net_amount, note: str(t.note) };
      if (t.side === 'sell') o.sell_reason = known(SELL_REASONS, t.sell_reason) ? t.sell_reason : 'other';
      d.trades.push(o);
    }
    for (const p of arr('plans')) {
      if (!HORIZONS.includes(p.horizon)) fail('A plan has an invalid horizon.');
      const o = {
        id: id(p.id, 'plan'), trade_id: typeof p.trade_id === 'string' && ID_RE.test(p.trade_id) ? p.trade_id : '', date: isDate(p.date) ? p.date : fail('A plan has an invalid date.'),
        horizon: p.horizon, buy_reason: known(BUY_REASONS, p.buy_reason) ? p.buy_reason : null, thesis: str(p.thesis),
        target: numOrNull(p.target), stop: numOrNull(p.stop), review_by: isDate(p.review_by) ? p.review_by : null, off_list: !!p.off_list
      };
      if (typeof p.at_loss === 'boolean') o.at_loss = p.at_loss;
      d.plans.push(o);
    }
    const u = src.universe && typeof src.universe === 'object' && !Array.isArray(src.universe) ? src.universe : {};
    for (const [k, v] of Object.entries(u)) {
      const hs = Array.isArray(v) ? HORIZONS.filter(h => v.includes(h)) : [];
      if (hs.length) d.universe[tick(k, 'universe entry')] = hs;
    }
    for (const s of arr('custom_symbols')) {
      const o = { ticker: tick(s.ticker, 'custom symbol'), name: str(s.name), sector: str(s.sector) };
      if (typeof s.withholding === 'number' && s.withholding >= 0 && s.withholding < 100) o.withholding = s.withholding;

function allocActual(D) {

  const D = getD(), A = allocActual(D), v = { ...A.v };

function xirr(flows, today) {

  const fl = flows.map(f => [daysBetween(t0, f[0]) / 365, f[1]]);

  const win = pp.filter(p => p.unrealC > 0).length;

  parts.push(`Dividends ${money(div)}${div && total > 0 ? ` <small>(${pct(div / total, false, 0)} of total gain)</small>` : ''}`);
  if (bought) parts.push(`Total return ${pctG(total / bought)} <small>incl. dividends</small>`);
  parts.push(`Avg held ${fmtHeld(held)}`);
  if (k !== 'trading' && held >= 365) {

    for (const p of pp) {

    db.prices[t] = { ...db.prices[t], price: p, as_of: d };
    closeModal(); commit('Price saved');
  });
}

// Edit plan / change horizon / add plan. Every change appends a new plan entry.
function planModal(pid, mode) {
  const p = getD().positions.find(x => x.id === pid);
  if (!p) return;
  const cur = p.plan || {}, isNew = !p.plan;
  const h0 = mode === 'horizon' ? HORIZONS.find(h => h !== cur.horizon) : (cur.horizon || (tags(p.ticker).length === 1 ? tags(p.ticker)[0] : ''));
  const typed = db.prices[p.ticker];
  const hOpts = HORIZONS.filter(h => mode !== 'horizon' || h !== cur.horizon).map(h => `<option value="${h}"${h === h0 ? ' selected' : ''}>${HL[h]} (${HOLD[h]})</option>`).join('');
  const title = mode === 'horizon' ? `Change horizon — ${p.ticker}` : isNew ? `Add a plan — ${p.ticker}` : `Edit plan — ${p.ticker}`;
  const m = openModal(`<h2>${esc(title)}</h2><form class="form" id="f-plan">

      `<label class="field"><span>${mode === 'horizon' ? 'New horizon' : 'Horizon'}</span><select name="horizon" required>${isNew ? '<option value="">Choose…</option>' : ''}${hOpts}</select></label>`}
    ${isNew ? `<label class="field"><span>Buy reason</span><select name="buy_reason" required>${opts(BUY_REASONS, '', 'Choose…')}</select></label>` : ''}
    ${mode === 'horizon' ? `<label class="field"><span>Price now <small>(to check whether the position is at a loss)</small></span><input name="price" inputmode="decimal" required value="${typed ? typed.price : ''}"></label>
      <p class="hint">Average cost ${fmtPrice(p.costC / p.held / 100)}. Moving a losing Trading or Mid-term position to Long term is flagged.</p>` : ''}
    <label class="field"><span>Thesis</span><textarea name="thesis" rows="2">${esc(cur.thesis || '')}</textarea></label>
    <div class="row2"><label class="field"><span>Target</span><input name="target" inputmode="decimal" value="${cur.target ?? ''}"></label>
    <label class="field"><span>Stop</span><input name="stop" inputmode="decimal" value="${cur.stop ?? ''}"></label></div>
    <label class="field" id="rb-field"><span>Review by</span><input type="date" name="review_by" value="${cur.review_by || addMonths(todayStr(), 12)}"></label>
    <div id="plan-msg"></div>
    <div class="actions"><button class="btn primary">Save</button><button type="button" class="btn" data-x="cancel">Cancel</button></div></form>`);
  const f = $('#f-plan', m);
  const hz = () => f.horizon ? f.horizon.value : cur.horizon;
  const sync = () => { $('#rb-field', m).hidden = hz() !== 'long'; };
  sync();
  f.addEventListener('change', sync);
  m.addEventListener('click', e => { if (e.target.closest('[data-x]')) closeModal(); });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const h = hz(), msg = $('#plan-msg', m);
    const tg = parseNum(f.target.value), st = parseNum(f.stop.value);
    if (!HORIZONS.includes(h)) { msg.innerHTML = '<p class="msg bad">Choose a horizon.</p>'; return; }
    if (isNew && !f.buy_reason.value) { msg.innerHTML = '<p class="msg bad">Choose a buy reason.</p>'; return; }
    if ((f.target.value.trim() && !(tg > 0)) || (f.stop.value.trim() && !(st > 0))) { msg.innerHTML = '<p class="msg bad">Target and stop must be prices above zero, or empty.</p>'; return; }
    const np = {
      id: uid(), trade_id: p.id, date: todayStr(), horizon: h, buy_reason: isNew ? f.buy_reason.value : (p.origPlan.buy_reason || null),
      thesis: f.thesis.value.trim(), target: f.target.value.trim() ? tg : null, stop: f.stop.value.trim() ? st : null,
      review_by: h === 'long' && isRealDate(f.review_by.value) ? f.review_by.value : null,
      off_list: isNew ? !tags(p.ticker).includes(h) : !!p.origPlan.off_list
    };
    let flagged = false;
    if (mode === 'horizon') {
      const px = parseNum(f.price.value);
      if (!(px > 0)) { msg.innerHTML = '<p class="msg bad">Enter the current price.</p>'; return; }
      np.at_loss = grossC(p.held, px) < p.costC;
      flagged = np.at_loss && h === 'long' && cur.horizon !== 'long';
      if (!typed || typed.price !== px || typed.as_of !== todayStr()) db.prices[p.ticker] = { ...db.prices[p.ticker], price: px, as_of: todayStr() };
    }
    db.plans.push(np);
    closeModal();
    commit(flagged ? 'Saved. Flagged: a losing position moved to Long term.' : 'Plan saved');
  });
}

// ===== Ticker picker =====
function searchSymbols(q, limit = 12) {
  const Q = q.trim().toUpperCase();
  const all = allSymbols();
  const scored = [];
  for (const s of all) {
    let sc;
    if (!Q) sc = tags(s.ticker).length ? 0 : null;
    else if (s.ticker === Q) sc = -1;
    else if (s.ticker.startsWith(Q)) sc = 0;
    else if (s.ticker.includes(Q)) sc = 1;
    else if (s.name.toUpperCase().includes(Q)) sc = 2;
    else sc = null;
    if (sc != null) scored.push({ s, sc, tg: tags(s.ticker).length ? 0 : 1 });
  }
  scored.sort((a, b) => (a.sc === -1 ? -1 : 0) - (b.sc === -1 ? -1 : 0) || a.tg - b.tg || a.sc - b.sc || (a.s.ticker < b.s.ticker ? -1 : 1));
  return scored.slice(0, limit).map(x => x.s);
}
function pickerHTML(name, val) {
  return `<div class="field picker" data-picker="${name}"><span>Ticker</span>
    <input class="pk-in" placeholder="Ticker or name" value="${esc(val ? symLabel(val) : '')}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Ticker">
    <input type="hidden" name="${name}" value="${esc(val || '')}"><div class="pk-list" hidden></div></div>`;
}
function mountPicker(root, onPick) {
  const inp = $('.pk-in', root), hid = $('input[type=hidden]', root), list = $('.pk-list', root);
  let hl = 0;
  const pick = t => { hid.value = t; inp.value = symLabel(t); list.hidden = true; onPick(t); };
  const show = () => {
    const q = hid.value ? '' : inp.value;
    const res = searchSymbols(q);
    const qt = normT(q);
    let h = res.map((s, i) => `<button type="button" class="pk-opt${i === hl ? ' hl' : ''}" data-t="${s.ticker}"><b>${s.ticker}</b><span>${esc(s.name)}</span>${tags(s.ticker).map(x => `<small>${x === 'trading' ? 'T' : x === 'mid' ? 'M' : 'L'}</small>`).join('')}</button>`).join('');
    if (qt && !isKnown(qt)) h += `<button type="button" class="pk-opt pk-add" data-add="${esc(TICKER_RE.test(qt) ? qt : '')}">+ Add symbol${TICKER_RE.test(qt) ? ` “${esc(qt)}”` : ''}</button>`;
    if (!q && !res.length) h = `<div class="pk-opt muted">Type a ticker or company name. Tag tickers in Universe to see them here first.</div>`;
    list.innerHTML = h; list.hidden = !h;
  };
  inp.addEventListener('focus', () => { hl = 0; show(); if (hid.value) inp.select(); });
  inp.addEventListener('input', () => { if (hid.value) { hid.value = ''; onPick(''); } hl = 0; show(); });
  inp.addEventListener('keydown', e => {
    const opts_ = $$('.pk-opt[data-t],.pk-opt[data-add]', list);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hl = Math.max(0, Math.min(opts_.length - 1, hl + (e.key === 'ArrowDown' ? 1 : -1))); opts_.forEach((o, i) => o.classList.toggle('hl', i === hl)); }
    else if (e.key === 'Enter' && !list.hidden && opts_[hl]) { e.preventDefault(); opts_[hl].click(); }
    else if (e.key === 'Escape') list.hidden = true;
  });
  list.addEventListener('mousedown', e => e.preventDefault());
  list.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.t) pick(b.dataset.t);
    else { list.hidden = true; symbolModal(null, b.dataset.add || '', t => pick(t)); }
  });
  inp.addEventListener('blur', () => setTimeout(() => {
    list.hidden = true;
    const qt = normT(inp.value);
    if (!hid.value && qt && isKnown(qt)) pick(qt);
  }, 120));
}

  };

// Where does this trade fall in the ticker's history? Simulates the log with it inserted.
function tradeContext(v) {
  if (!v.ticker || !DATE_RE.test(v.date)) return { mode: 'none' };
  const editId = logState.editId;
  const me = { id: editId || '__new', date: v.date, side: v.side, ticker: v.ticker, shares: v.shares > 0 ? v.shares : 0 };
  const list = editId ? db.trades.map(t => t.id === editId ? me : t) : [...db.trades, me];
  let held = 0, cost = 0, openId = null, openDate = null;
  const arr = sortedByDate(list.filter(t => t.ticker === v.ticker));
  for (const [idx, t] of arr.entries()) {
    if (t === me) {
      const planId = held ? openId : me.id;
      const plans = db.plans.filter(p => p.trade_id === (editId && !held ? editId : planId));
      const plan = plans[plans.length - 1] || null;
      if (v.side === 'buy' && !held && !plans.length) { // an earlier buy that joins a position we already hold keeps that position's plan
        const openers = new Set(getD().positions.map(p => p.id));
        for (let h = me.shares, j = idx + 1; j < arr.length && h > 0; j++) {
          const t2 = arr[j];
          if (t2.side === 'sell') { h -= t2.shares; continue; }
          const old = db.plans.filter(p => p.trade_id === t2.id);
          if (openers.has(t2.id) && old.length) return { mode: 'open', absorbs: true, from: t2.id, plan: old[old.length - 1], orig: old[0] };
          h += t2.shares;
        }
      }
      if (v.side === 'buy') return held ? { mode: 'add', held, cost, openId, openDate, plan, orig: plans[0] } : { mode: 'open', plan, orig: plans[0] };
      return { mode: 'sell', held, cost, openId, openDate, plan, orig: plans[0] };
    }
    const n = t.id === me.id ? 0 : C(t.net_amount);
    if (t.side === 'buy') { if (!held) { openId = t.id; openDate = t.date; } held += t.shares; cost += n; }
    else { const sh = Math.min(t.shares, held); const part = sh === held ? cost : Math.round(cost * sh / held); cost -= part; held -= sh; }
  }
  return { mode: 'none' };
}
let tradeMode = null;

function mountTrade() {
  const f = $('#f-trade');

}
function tradeUpdate(e) {
  const f = $('#f-trade'); if (!f) return;
  const v = readTrade(f);
  // Fee estimate
  const est = v.shares > 0 && Number.isInteger(v.shares) && v.price > 0 ? feeEstimate(v.side, v.shares, v.price, v.date) : null;
  const hint = $('#fee-hint');
  if (est) {
    let s = `Estimate ${money(est.net)}: gross ${money(est.gross)} ${v.side === 'buy' ? '+' : '−'} fees ${money(est.fees)} (commission ${money(est.comm)}, VAT ${money(est.vat)}, PSE ${money(est.pse)}, SCCP ${money(est.sccp)}${est.stt ? `, sales tax ${money(est.stt)}` : ''}).`;
    if (v.net > 0) { const fees = v.side === 'buy' ? C(v.net) - est.gross : est.gross - C(v.net); s += ` Your fees: ${money(fees)} (${pct(fees / est.gross, false, 2)}).`; }
    hint.textContent = s;
  } else hint.textContent = 'Type shares and price to see a fee estimate.';
  // Context
  if (!DATE_RE.test(v.date) && sec_().innerHTML) return; // a half-typed date (Chrome reports '' mid-typing): leave the form as it is
  const ctx = tradeContext(v);
  const box = $('#trade-ctx'), sec = $('#trade-sec');
  let info = '';
  const planInfo = p => p ? `<div class="hint">Plan: ${planLine(p)}${p.thesis ? ` — ${esc(p.thesis)}` : ''}</div>` : '<div class="hint">No plan recorded.</div>';
  if (ctx.absorbs) info = `<p class="msg info">This buy is earlier than your existing <b>${esc(v.ticker)}</b> position. It becomes the start of that position and keeps its plan.</p>`;
  else if (ctx.mode === 'open') info = `<p class="msg info">This buy opens a new position in <b>${esc(v.ticker)}</b>.</p>`;
  else if (ctx.mode === 'add') info = `<div class="msg info">Adds to your ${ctx.plan ? HL[ctx.plan.horizon] : ''} position: ${fmtShares(ctx.held)} shares at average ${fmtPrice(ctx.cost / ctx.held / 100)}, opened ${fmtDate(ctx.openDate)}.${planInfo(ctx.plan)}</div>`;
  else if (ctx.mode === 'sell') info = ctx.held ? `<div class="msg info">You hold <b>${fmtShares(ctx.held)}</b> shares at average ${fmtPrice(ctx.cost / ctx.held / 100)}${ctx.plan ? ` (${HL[ctx.plan.horizon]})` : ''}, opened ${fmtDate(ctx.openDate)}.${ctx.orig ? `<div class="hint">Original plan: ${planLine(ctx.orig)}${ctx.orig.thesis ? ` — ${esc(ctx.orig.thesis)}` : ''}</div>` : ''}${ctx.plan && ctx.plan !== ctx.orig ? planInfo(ctx.plan) : ''}</div>`
    : `<p class="msg bad">You hold no ${esc(v.ticker)} shares on ${fmtDate(v.date)}.</p>`;
  box.innerHTML = info;
  const editingPlanned = ctx.mode === 'open' && !ctx.absorbs && logState.editId && ctx.plan;
  const mode = ctx.mode + (editingPlanned ? '-planned' : ctx.absorbs ? '-absorb' : '');
  const planChanged = e && e.target && e.target.name === 'horizon';
  if (mode !== tradeMode || planChanged) {
    const pv = $('#f-trade fieldset') ? readPlanForm(f) : {};
    if (ctx.absorbs) sec.innerHTML = '';
    else if (ctx.mode === 'open' && !editingPlanned) sec.innerHTML = planFormHTML(v, pv);
    else if (editingPlanned) sec.innerHTML = `<p class="hint">This position's plan is edited from Open positions (Plan and history).</p>`;
    else if (ctx.mode === 'sell') sec.innerHTML = sellSecHTML(ctx, v);
    else sec.innerHTML = '';
    tradeMode = mode;
  } else if (ctx.mode === 'open' && e && e.target && e.target.name === 'date' && f.review_by && !f.review_by.dataset.touched && DATE_RE.test(v.date)) {
    f.review_by.value = addMonths(v.date, 12);
  }
  if (e && e.target && e.target.name === 'review_by') e.target.dataset.touched = '1';
  // Warnings
  const w = [];
  if (v.ticker && !BUNDLED.has(v.ticker)) w.push(['', `${esc(v.ticker)} is not in the current PSE list${customOf(v.ticker) ? ' (custom symbol)' : ''}.`]);
  if (est && v.net > 0) {
    const diff = (C(v.net) - est.net) / est.net;
    if (Math.abs(diff) > 0.02) w.push(['warn', `The net amount is ${pct(Math.abs(diff))} ${diff > 0 ? 'above' : 'below'} the estimate. Check it against your confirmation.`]);
  }
  if (ctx.mode === 'open' && !editingPlanned && !ctx.absorbs) {
    const p = readPlanForm(f);

async function deleteEntry(kind, id) {
  const label = kind === 'trade' ? 'trade' : kind === 'dividend' ? 'dividend' : 'cash entry';
  if (kind === 'trade') {
    const next = db.trades.filter(t => t.id !== id);
    const err = checkTrades(next);
    if (err) return confirmBox('Can\'t delete this trade', `<p>Deleting it would leave a sell with no shares to sell:</p><p class="msg bad">${esc(err)}</p><p>Delete or edit the later sell first.</p>`, 'OK');
    const planned = db.plans.some(p => p.trade_id === id), others = planned && getD().positions.find(p => p.id === id)?.trades.some(t => t.side === 'buy' && t.id !== id);
    const gone = db.trades.find(t => t.id === id);
    let merge = '';
    if (gone && gone.side === 'sell') { // without this sell, two positions in the ticker run together into one
      const was = getD().byTicker[gone.ticker] || [], keep = db.trades;
      db.trades = next; const after = derive().byTicker[gone.ticker] || []; db.trades = keep;
      if (after.length < was.length) {
        const planned = was.filter(p => p.plans.length), hid = after.some(q => planned.filter(p => q.trades.some(t => t.id === p.id)).length > 1);
        merge = `<p class="msg warn">This sell is what separates two ${esc(gone.ticker)} positions. Without it they become one position${hid ? ', and only the earlier position\'s plan history stays visible (the other is kept but hidden)' : ''}. Closed results change too.</p>`;
      }
    }
    if (!await confirmBox('Delete this trade?', merge + (planned ? (others ? '<p>This buy opened the position, and its plan history will be deleted with it. The position will show "No plan" until you add one.</p>' : '<p>This buy opened a position and its plan history will be deleted with it.</p>') : '<p>This can\'t be undone (unless you have a backup).</p>'), 'Delete', true)) return;
    const now = db.trades.filter(t => t.id !== id); // the log may have changed (another tab) while the box was open
    if (now.length === db.trades.length) return;
    const err2 = checkTrades(now);
    if (err2) return confirmBox('Can\'t delete this trade', `<p class="msg bad">${esc(err2)}</p>`, 'OK');
    db.trades = now;
    prunePlans();
  } else {
    if (!await confirmBox(`Delete this ${label}?`, '<p>This can\'t be undone (unless you have a backup).</p>', 'Delete', true)) return;
    if (kind === 'dividend') db.dividends = db.dividends.filter(d => d.id !== id);
    else db.cash = db.cash.filter(c => c.id !== id);
  }
  commit('Deleted');
}

function parsePricesReply(text, today, wanted) {
  const marked = [...String(text).matchAll(/BEGIN_PSE_PRICES([\s\S]*?)(?:END_PSE_PRICES|$)/gi)];
  const body = marked.length ? marked.map(m => m[1]).join('\n') : String(text);
  const num = v => (v == null || /^(NA|N\/A|NULL|NONE|-|—|)$/i.test(v.trim())) ? null : (x => isFinite(x) ? x : NaN)(parseNum(v));
  const rows = [], seen = new Set();
  for (let line of body.split(/\r?\n/)) {
    if (/^\s*```/.test(line)) continue;
    line = line.replace(/[`*₱]/g, '').trim().replace(/^\||\|$/g, '').trim();
    if (!line || /^[-:|\s]+$/.test(line)) continue;
    const f = line.split(/[,|\t]/).map(x => x.trim());
    if (/^TICKER$/i.test(f[0])) continue;
    if (!marked.length && f.length !== 5) continue;
    const t = normT(f[0]).replace(/^PSE:/, '').replace(/\.PS$/, '');
    const r = { t, raw: f[0], warn: [], block: [], note: [], range: false };
    if (!TICKER_RE.test(t)) r.block.push('Not a valid ticker');
    else if (seen.has(t)) r.block.push('Duplicate line');
    seen.add(t);
    if (f.length !== 5) r.block.push(`Expected 5 values, found ${f.length}`);
    else {
      const pr = num(f[1]), lo = num(f[3]), hi = num(f[4]), d = f[2].trim();
      r.price = pr; r.as_of = d; r.low = lo; r.high = hi;
      if (pr === null) r.block.push('No price');
      else if (Number.isNaN(pr) || !(pr > 0) || pr >= 1e6) r.block.push('Price is not a usable number');
      if (pr !== null && !validDate(d)) r.block.push('No valid date');
      else if (validDate(d)) {
        if (d > today) r.warn.push('Date is in the future');
        else if (daysBetween(d, today) > 7) r.warn.push('Date is over 7 days old');
      }
      const okN = x => x != null && !Number.isNaN(x) && x > 0;
      if (okN(lo) && okN(hi)) {
        if (lo > hi) r.warn.push('52-week low is above the high (range not saved)');
        else {
          r.range = true;
          if (pr > 0 && (pr < lo || pr > hi)) r.warn.push('Price is outside the 52-week range');
        }
      } else if (lo !== null || hi !== null) r.note.push('52-week range incomplete (not saved)');
    }
    if (TICKER_RE.test(t) && !wanted.has(t)) r.warn.push('Not in this universe list');
    rows.push(r);
  }
  return rows;
}

  const pages = Math.ceil(ps.length / CLOSED_PAGE);

      <td class="num">${money(p.divC)}</td><td class="num">${rMult(p)}</td><td class="num">${moneyG(p.totalC)}</td><td class="num">${pctG(p.retPct)}</td>
      <td class="nowrap">${hs}</td><td>${esc(p.origPlan ? BUY_REASONS[p.origPlan.buy_reason] || '—' : '—')}</td><td>${esc(reasons)}${vsPlan(p)}</td><td>${badgeHTML(p.badges.filter(b => b !== 'hchanged'))}</td></tr>
      <tr class="detail" data-d="${i}" hidden><td colspan="16" style="white-space:normal"><div style="max-width:700px">${tradesMini(p)}${planDetailHTML(p)}</div></td></tr></tbody>`;
  }).join('');
  h += `<section class="card" id="closed-pos"><h2>Positions</h2><p class="hint">Tap a row for its trades, dividends and plan history. Entry and exit are share-weighted fill prices.</p><div class="tbl-wrap"><table class="data wide">
    <thead><tr><th>Ticker</th><th>Opened</th><th>Closed</th><th class="num">Days</th><th class="num">Entry</th><th class="num">Exit</th><th class="num">Cost</th><th class="num">Realized</th><th class="num">Dividends</th><th class="num" title="Price return divided by the risk to the original stop">R</th><th class="num">Total return</th><th class="num">%</th><th>Horizon</th><th>Buy reason</th><th>Sell reason</th><th>Badges</th></tr></thead>
    ${rows}</table></div>${pages > 1 ? `<div class="toolbar" style="justify-content:space-between;margin-top:10px"><button class="btn" data-act="cpage" data-d="-1"${closedPage === 0 ? ' disabled' : ''}>Newer</button><span class="hint">${from + 1}–${Math.min(from + CLOSED_PAGE, ps.length)} of ${ps.length}</span><button class="btn" data-act="cpage" data-d="1"${closedPage >= pages - 1 ? ' disabled' : ''}>Older</button></div>` : ''}</section>`;
  {
    const yrs = {};
    for (const p of D.closed.filter(inF)) (yrs[p.closeDate.slice(0, 4)] = yrs[p.closeDate.slice(0, 4)] || []).push(p);
    const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    const yrow = ([y, g]) => {
      const gs = groupStats(g), rs = g.map(p => { const st = p.origPlan && p.origPlan.stop; return st == null || p.entry == null || p.exit == null || p.entry <= st ? null : (p.exit - p.entry) / (p.entry - st); }).filter(r => r != null);

        <td class="num">${pctG(gs.retPct)}</td><td class="num">${pctG(mean(g.map(p => p.retPct)))}</td><td class="num">${moneyG(gs.total)}</td><td class="num">${pct(gs.winRate, false, 0)}</td>

    };
    h += `<section class="card"><h2>By year closed</h2><p class="hint">Am I improving? Trades are counted in the year they were closed, and the time filter above is ignored here. Return % is total return ÷ total cost (bigger trades count more); Avg % per trade counts every trade equally. Avg sale is before fees, and returns include dividends and fees, so sale minus cost will not match exactly. Avg R is return divided by the risk to your original stop. Years with only a few trades say little.</p><div class="tbl-wrap"><table class="data"><thead><tr><th>Year</th><th class="num">Trades</th><th class="num">Avg cost</th><th class="num">Avg sale</th><th class="num">Return %</th><th class="num">Avg % per trade</th><th class="num">Total return</th><th class="num">Win rate</th><th class="num">Avg R</th></tr></thead><tbody>${Object.entries(yrs).sort().reverse().map(yrow).join('')}</tbody></table></div></section>`;
  }
  if (closedFilter === 'all') h += `<section class="card"><h2>By horizon</h2>${statTable('Horizon', [...HORIZONS.map(k => [HL[k], ps.filter(p => p.horizon === k)]), ['No plan', ps.filter(p => !p.horizon)]].filter(r => r[1].length), ['n', 'wr', 'pf', 'tot', 'ret', 'days'])}</section>`;
  const secs = Object.create(null);

  h += `<section class="card"><h2>By sector</h2>${statTable('Sector', Object.keys(secs).sort().map(k => [esc(k), secs[k]]), ['n', 'wr', 'tot', 'ret'])}</section>`;
  const dl = (t, d) => `${t}<div class="hint" style="margin:0;white-space:normal">${d}</div>`;
  const disc = [
    [dl('All closed', 'Every closed position above. Compare the other rows to this one.'), ps],
    [dl('On-list buys', 'The ticker was on your list for its horizon when you bought it.'), ps.filter(p => p.origPlan && !p.origPlan.off_list)],
    [dl('Off-list buys', 'Not on your list when you bought it.'), ps.filter(p => p.badges.includes('offlist'))],
    [dl('Moved to Long term at a loss', 'You changed the horizon to Long term while it was losing.'), ps.filter(p => p.badges.includes('losslong'))],
    [dl('Overstayed', 'Held past the horizon\'s maximum: over 1 month for Trading, over 12 months for Mid term.'), ps.filter(p => p.badges.includes('overstayed'))],
    [dl('Early exits', 'Sold before the horizon\'s minimum: under 12 months for Long term, under 1 month for Mid term.'), ps.filter(p => p.badges.includes('early'))]
  ];
  h += `<section class="card"><h2>Discipline</h2><p class="hint">Did you follow your own rules, and what did it cost or earn? If a rule-breaking row does worse than All closed, the rule was worth keeping.</p>${statTable('', disc.filter(([l, a]) => a.length), ['n', 'wr', 'tot'])}<p class="hint">Rows overlap: a position can be off-list and overstayed, so don't add them up. Rows with no positions are hidden.</p></section>`;
  const br = Object.keys(BUY_REASONS).map(k => [BUY_REASONS[k], ps.filter(p => p.origPlan && p.origPlan.buy_reason === k)]).filter(r => r[1].length);
  const nobr = ps.filter(p => !p.origPlan || !p.origPlan.buy_reason); if (nobr.length) br.push(['No reason recorded', nobr]);
  h += `<section class="card"><h2>By buy reason</h2>${statTable('Reason', br, ['n', 'wr', 'tot', 'ret'])}</section>`;
  // Every sell, trims in open positions included
  const sells = D.positions.filter(inF).flatMap(p => p.sells).filter(x => x.t.date >= since);
  const sr = Object.keys(SELL_REASONS).map(k => { const a = sells.filter(x => x.t.sell_reason === k); return [k, a]; }).filter(r => r[1].length);
  h += `<section class="card"><h2>By sell reason</h2>${sr.length ? `<div class="tbl-wrap"><table class="data"><thead><tr><th>Reason</th><th class="num">Sells</th><th class="num">With a gain</th><th class="num">Realized gain</th></tr></thead><tbody>
    ${sr.map(([k, a]) => `<tr><td>${esc(SELL_REASONS[k])}</td><td class="num">${a.length}</td><td class="num">${a.filter(x => x.realizedC > 0).length}</td><td class="num">${moneyG(sum(a, x => x.realizedC))}</td></tr>`).join('')}</tbody></table></div><p class="hint">Every sell, trims included. Realized gain excludes dividends.</p>` : '<p class="muted">No sells.</p>'}</section>`;
  const planned = ps.filter(p => p.origPlan && (p.origPlan.target != null || p.origPlan.stop != null));
  if (planned.length) {
    let above = 0, mid = 0, below = 0;
    for (const p of planned) {
      const o = p.origPlan;
      if (o.target != null && p.exit >= o.target) above++;
      else if (o.stop != null && p.exit <= o.stop) below++;
      else mid++;
    }
    const moved = planned.filter(stopLoweredOrTargetRaised).length;
    h += `<section class="card"><h2>Plan check</h2><p class="hint">${planned.length} closed ${planned.length === 1 ? 'position' : 'positions'} with an original target or stop, by average exit price.</p><dl class="kv">
      <dt>Exit at or above target</dt><dd>${above}</dd><dt>Exit between stop and target</dt><dd>${mid}</dd><dt>Exit at or below stop</dt><dd>${below}</dd>
      <dt>Stop later lowered or target raised</dt><dd>${moved}</dd>
      <dt>Result when plan was kept</dt><dd>${planned.length - moved} <small>positions</small> ${moneyG(sum(planned.filter(p => !stopLoweredOrTargetRaised(p)), p => p.totalC))}</dd>
      <dt>Result when plan was moved</dt><dd>${moved} <small>positions</small> ${moneyG(sum(planned.filter(stopLoweredOrTargetRaised), p => p.totalC))}</dd></dl></section>`;
  }
  return h;
};

// Import a pasted list of tickers and tag them (adds only, never removes)
function parseTickerList(text) {
  const seen = new Set(), out = [];
  for (const raw of String(text).replace(/^\s*```.*$/gm, ' ').split(/[\s,;]+/)) {
    const t = normT(raw).replace(/^PSE:/, '').replace(/\.PS$/, '');
    if (t && !seen.has(t)) { seen.add(t); out.push(t); }
  }
  return out;
}
function importListModal() {
  const m = openModal(`<h2>Import list</h2><form class="form" id="f-imp">
    <label class="field"><span>Tickers <small>(separate with commas, spaces or new lines)</small></span><textarea name="text" rows="4" spellcheck="false" autocapitalize="characters" placeholder="BDO, ALI, SM"></textarea></label>
    <div class="field"><span>Tag as</span><div class="nowrap">${HORIZONS.map(h => `<label class="nowrap"><input type="checkbox" name="h_${h}" value="${h}"> ${HL[h]}</label>`).join(' ')}
      <button type="button" class="btn small" data-x-all>All three</button></div></div>
    <div id="imp-prev"></div>
    <div class="actions"><button class="btn primary" id="imp-ok" disabled>Confirm</button><button type="button" class="btn" data-x>Cancel</button></div></form>`);
  const f = $('#f-imp', m), prev = $('#imp-prev', m), ok = $('#imp-ok', m);
  let plan = null;
  const chosen = () => HORIZONS.filter(h => f['h_' + h].checked);
  const chips = list => list.map(t => `<b>${esc(t.length > 20 ? t.slice(0, 20) + '…' : t)}</b>`).join(', ');
  const update = () => {
    const hs = chosen(), toks = parseTickerList(f.text.value);
    plan = { hs, apply: [], unknown: [], done: [], invalid: [] };
    for (const t of toks) {
      if (!TICKER_RE.test(t)) plan.invalid.push(t);
      else if (!isKnown(t)) plan.unknown.push(t);
      else if (hs.every(h => tags(t).includes(h))) plan.done.push(t);
      else plan.apply.push(t);
    }
    const unk = plan.unknown.map(t => `<label class="nowrap"><input type="checkbox" data-unk="${t}"> ${t}</label>`).join(' ');
    let h = '';
    if (!toks.length) h = '<p class="hint">Paste some tickers to see a preview. Nothing is saved until you confirm.</p>';
    else {
      if (plan.apply.length) h += `<p><b>Will tag (${plan.apply.length}):</b> ${chips(plan.apply)}</p>`;
      if (plan.unknown.length) h += `<p><b>Not in the PSE list or your symbols (${plan.unknown.length}):</b> tick to add as custom symbols and tag them <button type="button" class="btn link small" data-unk-all>Tick all</button><br>${unk}</p>`;
      if (plan.done.length) h += `<p class="hint"><b>Already tagged (${plan.done.length}):</b> ${chips(plan.done)}</p>`;
      if (plan.invalid.length) h += `<p class="msg bad"><b>Invalid, skipped (${plan.invalid.length}):</b> ${chips(plan.invalid)}. Tickers are letters and digits, up to 8 characters.</p>`;
      if (!hs.length) h += '<p class="msg warn">Choose at least one horizon.</p>';
    }
    // keep ticks across re-render
    const ticked = new Set($$('[data-unk]:checked', prev).map(x => x.dataset.unk));
    prev.innerHTML = h;
    $$('[data-unk]', prev).forEach(x => { x.checked = ticked.has(x.dataset.unk); });
    refresh();
  };
  const picked = () => $$('[data-unk]:checked', prev).map(x => x.dataset.unk);
  const refresh = () => { ok.disabled = !plan.hs.length || !(plan.apply.length || picked().length); };
  f.addEventListener('input', e => { if (e.target.matches('[data-unk]')) refresh(); else update(); });
  m.addEventListener('click', e => {
    if (e.target.closest('[data-x]')) closeModal();
    else if (e.target.closest('[data-x-all]')) { HORIZONS.forEach(h => { f['h_' + h].checked = true; }); update(); }
    else if (e.target.closest('[data-unk-all]')) { $$('[data-unk]', prev).forEach(x => { x.checked = true; }); refresh(); }
  });
  f.addEventListener('submit', e => {
    e.preventDefault();
    if (ok.disabled) return;
    const add = picked(), hs = plan.hs, list = [...plan.apply, ...add];
    for (const t of add) if (!BUNDLED.has(t) && !customOf(t)) db.custom_symbols.push({ ticker: t, name: '', sector: '' });
    for (const t of list) db.universe[t] = HORIZONS.filter(h => hs.includes(h) || tags(t).includes(h));
    closeModal();
    commit(`Tagged ${list.length} ticker${list.length === 1 ? '' : 's'}`);
  });
}
async function deleteSymbol(t) {
  if (db.trades.some(x => x.ticker === t) || db.dividends.some(x => x.ticker === t)) return confirmBox(`Can't delete ${t}`, '<p>Trades or dividends use this ticker. Delete those first.</p>', 'OK');
  if (!await confirmBox(`Delete ${t}?`, '<p>The custom symbol and its universe tags will be removed.</p>', 'Delete', true)) return;
  db.custom_symbols = db.custom_symbols.filter(c => c.ticker !== t);
  delete db.universe[t]; delete db.prices[t]; delete db.research[t];
  commit('Symbol deleted');
}

function exportDoc() {

}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function backupName(ext) { return `pinoy-trade-journal-${todayStr()}.${ext}`; }
function markBackedUp(at = isoLocal()) { db.last_backup_at = at; meta.changes = 0; saveMeta(); persist(); }
function backupText() { markBackedUp(); return JSON.stringify(exportDoc(), null, 2); }
function exportBlocked() { if (!loadFailed) return false; toast('Nothing to back up: your stored log could not be read. Import a backup first.'); return true; }
function exportJSON() { if (exportBlocked()) return; download(backupName('json'), backupText(), 'application/json'); render(); toast('Backup downloaded'); }
const CAN_SHARE_FILES = (() => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; } })();
async function shareJSON() {

  const file = new File([JSON.stringify(doc, null, 2)], backupName('json'), { type: 'application/json' });

function exportCSV() {
  if (exportBlocked()) return;
  const q = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['date', 'type', 'ticker', 'shares', 'price', 'amount', 'fees', 'horizon', 'buy_reason', 'sell_reason', 'note']];
  for (const x of allEntries().reverse()) {
    const e = x.e;
    if (x.kind === 'trade') {
      const pl = db.plans.find(p => p.trade_id === e.id);
      rows.push([e.date, e.side, e.ticker, e.shares, e.price, e.net_amount.toFixed(2), (tradeFeesC(e) / 100).toFixed(2), pl ? pl.horizon : '', pl && pl.buy_reason ? pl.buy_reason : '', e.sell_reason || '', e.note]);
    } else if (x.kind === 'dividend') rows.push([e.date, 'dividend', e.ticker, '', '', e.net_amount.toFixed(2), '', '', '', '', e.note]);
    else rows.push([e.date, e.type, '', '', '', e.amount.toFixed(2), '', '', '', '', e.note]);
  }
  download(backupName('csv'), '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n') + '\r\n', 'text/csv');
  toast('CSV downloaded');
}

    const preview = `${d.trades.length} trades, ${d.dividends.length} dividends, ${d.cash.length} cash entries` +
      (dates.length ? `, last entry ${dates[dates.length - 1]}` : '') + (d.exported_at ? `, exported ${d.exported_at.slice(0, 10)}` : '');
    const ok = await confirmBox('Replace your data with this backup?', `<p class="msg info">${esc(preview)}</p>
      <p>This <b>replaces everything</b> in this log${cur ? ` (${cur} entries now)` : ''}. There is no merge. ${cur ? 'Export a backup first if you might want the current data.' : ''}</p>`, 'Replace', true);
    if (!ok) return;
    d.last_backup_at = d.exported_at || isoLocal();
    db = d; loadFailed = false; meta.changes = 0; meta.sample = false; saveMeta(); storageError = null;
    persist(); go('summary'); toast('Backup imported');
  };
  r.readAsText(file);
}

const FS_OK = 'showSaveFilePicker' in window && window.isSecureContext !== false;
let fileHandle = null, filePerm = 'none', fileErr = null, fileTimer;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(APP, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) {
  const d = await idb();
  return new Promise((res, rej) => { const q = fn(d.transaction('kv', mode).objectStore('kv')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function fileInit() {
  if (!FS_OK) return;
  try {
    fileHandle = await idbDo('readonly', s => s.get('file')) || null;
    if (fileHandle) filePerm = await fileHandle.queryPermission({ mode: 'readwrite' });
  } catch (e) { fileHandle = null; }
  if (fileHandle && filePerm === 'granted' && !loadFailed && !isBlank()) fileWrite(); // never overwrite the backup file with an empty log at startup
  if (view === 'data' || view === 'summary') render();
}
let fileBusy = false, fileAgain = false;
async function fileWrite() {
  if (!fileHandle || filePerm !== 'granted' || loadFailed) return;
  if (fileBusy) { fileAgain = true; return; } // one write at a time, so an older write can't finish last
  fileBusy = true;
  try {
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(exportDoc(), null, 2)); await w.close();
    if (isBlank()) meta.file_written_at = null; // an empty file is not a backup
    else { meta.file_written_at = isoLocal(); meta.changes = 0; }
    saveMeta(); fileErr = null;
  } catch (e) {
    fileErr = e.message || e.name;
    try { filePerm = await fileHandle.queryPermission({ mode: 'readwrite' }); } catch (x) { }
    if (view === 'data') render();
  } finally {
    fileBusy = false;
    if (fileAgain) { fileAgain = false; fileWrite(); }
  }
}
function fileWarn() { return fileHandle ? ` <b>The file you save to (${esc(fileHandle.name)}) will be overwritten too.</b>` : ''; }
function fileSaveSoon() { if (fileHandle && filePerm === 'granted') { clearTimeout(fileTimer); fileTimer = setTimeout(fileWrite, 400); } }
async function fileChoose() {
  try {
    const h = await window.showSaveFilePicker({ suggestedName: 'Pinoy Trade Journal.json', types: [{ description: 'Pinoy Trade Journal data', accept: { 'application/json': ['.json'] } }] });
    fileHandle = h; filePerm = 'granted';
    await idbDo('readwrite', s => s.put(h, 'file'));
    await fileWrite(); render(); toast('Saving to file');
  } catch (e) { if (e.name !== 'AbortError') toast('Could not use that file: ' + e.message); }
}
async function fileReconnect() {
  try { filePerm = await fileHandle.requestPermission({ mode: 'readwrite' }); } catch (e) { }
  if (filePerm === 'granted') await fileWrite();
  render();
}
async function fileStop() {
  fileHandle = null; filePerm = 'none'; fileErr = null;
  try { await idbDo('readwrite', s => s.delete('file')); } catch (e) { }
  render(); toast('Stopped saving to file');
}
function fileSectionHTML() {
  if (!FS_OK) return `<p class="hint">Saving every change to a file on your computer works in Chrome and Edge on a computer. Use Export in other browsers.</p>`;
  if (!fileHandle) return `<p>Pick a file once, for example in your Documents folder, and every change is written there too. If that folder syncs to OneDrive or Google Drive, that's a free cloud backup.</p>
    <button class="btn" data-act="file-choose">Choose file…</button>`;
  const when = meta.file_written_at ? `Last written ${fmtDate(meta.file_written_at)} ${meta.file_written_at.slice(11, 16)}.` : '';
  if (filePerm !== 'granted') return `<p class="msg warn">Saving to <b>${esc(fileHandle.name)}</b> is paused. The browser needs your permission again after a restart.</p>
    <div class="actions"><button class="btn primary" data-act="file-reconnect">Resume saving</button><button class="btn" data-act="file-stop">Stop saving to file</button></div>`;
  return `<p>Every change is saved to <b>${esc(fileHandle.name)}</b>. ${when}</p>${fileErr ? `<p class="msg bad">Last write failed: ${esc(fileErr)}</p>` : ''}
    <div class="actions"><button class="btn" data-act="file-choose">Choose another file…</button><button class="btn" data-act="file-stop">Stop saving to file</button></div>`;
}

MOUNTS.data = () => {
  const f = $('#f-settings');
  const upd = () => {
    const vals = [...HORIZONS, 'cash'].map(k => f['a_' + k].value.trim());
    const s = sum(vals, v => Number(v) || 0);
    $('#a-sum').innerHTML = vals.every(v => v === '') ? 'Leave all four empty to use the defaults (50 / 30 / 0 / 20).' : `Total: <b class="${s === 100 ? 'gain' : 'loss'}">${s}%</b> (must be 100)`;
  };
  f.addEventListener('input', upd); upd();
  f.addEventListener('submit', e => {
    e.preventDefault();
    const bad = s => { $('#set-msg').innerHTML = `<p class="msg bad">${s}</p>`; };
    const mc = parseNum(f.min_commission.value || '0'), band = parseNum(f.band.value);
    if (!(mc >= 0)) return bad('Minimum commission must be zero or more.');
    if (!(band >= 0 && band <= 50)) return bad('Band must be between 0 and 50.');
    const vals = [...HORIZONS, 'cash'].map(k => f['a_' + k].value.trim());
    let alloc = { ...DEFAULT_ALLOC };
    if (!vals.every(v => v === '')) {
      const n = vals.map(v => v === '' ? 0 : /^\d+$/.test(v) ? Number(v) : NaN);
      if (!n.every(x => Number.isInteger(x) && x >= 0)) return bad('Allocation targets must be whole percentages.');
      if (sum(n) !== 100) return bad(`Allocation targets add up to ${sum(n)}%, not 100%.`);
      alloc = { long: n[0], mid: n[1], trading: n[2], cash: n[3] };
    }
    db.settings = { min_commission: mc, allocation: alloc, allocation_band: band };
    changed(); persist(); render(); toast('Settings saved');
  });
};

function sampleData() {
  const d = emptyDb(), ids = {};
  for (const [date, amount] of SAMPLE.deposits) d.cash.push({ id: uid(), date, type: 'deposit', amount, note: '' });
  for (const [k, date, side, ticker, shares, price, reason, note] of SAMPLE.trades) {
    const t = { id: ids[k] = uid(), date, side, ticker, shares, price, net_amount: feeEstimate(side, shares, price, '2026-01-01', 0).net / 100, note };
    if (side === 'sell') t.sell_reason = reason;
    d.trades.push(t);
  }
  for (const [k, date, horizon, buy_reason, thesis, target, stop, review_by, off_list, at_loss] of SAMPLE.plans) {
    const p = { id: uid(), trade_id: ids[k], date, horizon, buy_reason, thesis, target, stop, review_by, off_list };
    if (at_loss) p.at_loss = true;
    d.plans.push(p);
  }
  for (const [date, ticker, net] of SAMPLE.dividends) d.dividends.push({ id: uid(), date, ticker, net_amount: net, note: '' });
  d.prices = SAMPLE.prices; d.universe = SAMPLE.universe; d.research = SAMPLE.research;
  d.settings.allocation = { long: 60, mid: 35, trading: 0, cash: 5 };
  return JSON.parse(JSON.stringify(d));
}

// ===== Actions =====
const ACTS = {
  'log-trade': () => startLog('trade'),
  'log-kind': b => { if (view === 'log' && !logState.editId) { logState.kind = b.dataset.k; render(); } else startLog(b.dataset.k); },
  'log-cancel': () => { const k = logState.kind; logState = { kind: k, editId: null, side: 'buy' }; go('history'); },
  'fill-est': () => {
    const f = $('#f-trade'), v = readTrade(f);
    const e = v.shares > 0 && Number.isInteger(v.shares) && v.price > 0 ? feeEstimate(v.side, v.shares, v.price, v.date) : null;
    if (!e) return toast('Type shares and price first.');
    f.net.value = (e.net / 100).toFixed(2); tradeUpdate();
  },
  edit: b => startLog(b.dataset.k, b.dataset.id),
  del: b => deleteEntry(b.dataset.k, b.dataset.id),
  price: b => priceModal(b.dataset.t),
  research: b => researchModal(b.dataset.t),
  plan: b => planModal(b.dataset.p, b.dataset.mode),
  hfilter: b => { histType = b.dataset.k; render(); },
  cfilter: b => { closedFilter = b.dataset.k; closedPage = 0; render(); },
  cperiod: b => { closedPeriod = b.dataset.k; closedPage = 0; render(); },
  cpage: b => { closedPage = Math.max(0, closedPage + +b.dataset.d); render(); $('#closed-pos').scrollIntoView(); },
  'pos-toggle': (b, e) => {
    const inner = e.target.closest('a,button'); if (inner && inner !== b) return;
    const id = b.dataset.id, r = $(`tr[data-d="${id}"]`); if (!r) return;
    r.hidden = !r.hidden; r.hidden ? openExp.delete(id) : openExp.add(id);
    const c = $(`.chev-btn[data-id="${id}"]`); if (c) { c.textContent = r.hidden ? '▸' : '▾'; c.setAttribute('aria-expanded', String(!r.hidden)); }
  },
  'pos-trade': b => { logState = { kind: 'trade', editId: null, side: b.dataset.side, ticker: b.dataset.t }; go('log'); },
  'goto-row': b => { closedPage = Math.floor(+b.dataset.i / CLOSED_PAGE); render(); const r = $(`tr[data-d="${b.dataset.i}"]`); if (!r) return; r.hidden = false; r.previousElementSibling.scrollIntoView({ block: 'center' }); },
  'toggle-row': b => { const r = $(`tr[data-d="${b.dataset.i}"]`); if (r) r.hidden = !r.hidden; },
  utag: b => toggleTag(b),
  'rv-del': async b => {
    if (!await confirmBox('Delete this review?', '<p>The saved review will be removed.</p>', 'Delete', true)) return;
    db.reviews = db.reviews.filter(r => r.id !== b.dataset.id);
    commit('Review deleted');
  },
  'wl-h': b => { wlH = b.dataset.h; render(); },
  'ai-copy': async b => {
    const ta = $('#' + (b.dataset.t || 'ai-prompt')); if (!ta) return;
    try { await navigator.clipboard.writeText(ta.value); toast('Prompt copied. Paste it into your AI.'); }
    catch (e) { ta.closest('details').open = true; ta.focus(); ta.select(); toast('Select the text and copy it (Ctrl+C).'); }
  },
  'sym-add': () => symbolModal(null, ''),
  'u-import': () => importListModal(),
  'sym-edit': b => symbolModal(b.dataset.t),
  'sym-del': b => deleteSymbol(b.dataset.t),
  export: () => exportJSON(),
  share: () => shareJSON(),
  import: () => { const i = $('#import-file'); i.value = ''; i.click(); },
  csv: () => exportCSV(),
  sample: () => {
    const load = () => { db = sampleData(); loadFailed = false; storageError = null; meta.sample = true; meta.changes = 0; saveMeta(); persist(); go('summary'); toast('Sample portfolio loaded'); };
    if (isBlank()) return load();
    const m = openModal(`<h2>Replace your data with the sample?</h2><p>This <b>deletes everything</b> in this browser (entries, plans, tags, prices, research and settings) and loads made-up data instead. It can't be undone. Export a backup first if you might want your data back.${fileWarn()}</p>
      <label class="field"><span>Type REPLACE to confirm</span><input id="sample-in" autocomplete="off" autocapitalize="characters"></label>
      <div class="actions"><button class="btn danger" id="sample-go" disabled>Replace with sample</button><button class="btn" data-x>Cancel</button></div>`);
    const inp = $('#sample-in', m), goBtn = $('#sample-go', m);
    inp.addEventListener('input', () => { goBtn.disabled = inp.value.trim().toUpperCase() !== 'REPLACE'; });
    m.addEventListener('click', e => {
      if (e.target.closest('[data-x]')) closeModal();
      if (e.target === goBtn && !goBtn.disabled) { closeModal(); load(); }
    });
  },
  'clear-sample': async () => { if (await confirmBox('Clear sample data?', `<p>Removes the sample portfolio so you can start your own log.${fileWarn()}</p>`, 'Clear')) { wipe(); toast('Sample data cleared'); } },
  erase: () => eraseAll(),
  'dl-unreadable': () => {
    let s = null; try { s = localStorage.getItem(STORE_KEY + ':unreadable:latest') ?? localStorage.getItem(STORE_KEY + ':unreadable'); } catch (e) { }
    if (s == null) return toast('No damaged copy was kept.');
    download('pinoy-trade-journal-unreadable.json', s, 'application/json');
  },
  'clear-alloc': () => { db.settings.allocation = { ...DEFAULT_ALLOC }; changed(); persist(); render(); toast('Allocation targets reset'); },
  'ios-dismiss': () => { meta.ios_dismissed_at = new Date().toISOString(); saveMeta(); render(); },
  'file-choose': () => fileChoose(),
  'file-reconnect': () => fileReconnect(),
  'file-stop': () => fileStop()
};
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); closeModal(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACTS[a.dataset.act] && !a.disabled) { e.preventDefault(); ACTS[a.dataset.act](a, e); }
});
$('#import-file').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); });
window.addEventListener('hashchange', () => {
  const was = view; view = parseHash(); closeModal();
  if (was === 'log' && view !== 'log') logState = { kind: logState.kind, editId: null, side: logState.side || 'buy' }; // leaving Log ends any edit
  render(); window.scrollTo(0, 0);
});
// Another tab changed the data: reload it.
window.addEventListener('storage', e => { if (e.key === STORE_KEY || e.key === META_KEY) { loadAll(); if (view !== 'log') render(); } });

// ===== Start =====
loadAll();
view = parseHash();
render();
fileInit();
